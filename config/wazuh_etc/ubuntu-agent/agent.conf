<agent_config>
  <localfile>
    <location>/var/log/audit/audit.log</location>
    <log_format>audit</log_format>
  </localfile>

  <localfile>
    <log_format>full_command</log_format>
    <command>ss -nputw | egrep 'ESTAB && "sh"|"bash"|"csh"|"ksh"|"zsh"' | awk '{ print $5 "|" $6 }'</command>
    <alias>webshell connections</alias>
    <frequency>60</frequency>
  </localfile>

  <client_buffer>
    <disabled>no</disabled>
    <queue_size>50000</queue_size>
    <events_per_second>1000</events_per_second>
  </client_buffer>

  <syscheck>
    <directories realtime="yes" check_all="yes" report_changes="yes">/var/www/html</directories>
  </syscheck>

</agent_config>
<agent_config>
  <localfile>
    <location>OpenSSH/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <client_buffer>
    <disabled>no</disabled>
    <queue_size>50000</queue_size>
    <events_per_second>1000</events_per_second>
  </client_buffer>

  <syscheck>
    <!-- Tần suất quét sâu định kỳ (mặc định 12 tiếng) -->
    <frequency>43200</frequency>

    <!-- ================= WINDOWS MONITORING ================= -->
    <!-- 1. Nơi Ransomware hay thực thi và ẩn nấp ban đầu -->
    <directories realtime="yes" report_changes="no" check_all="yes">C:\Users\*\AppData\Local\Temp</directories>
    <directories realtime="yes" report_changes="no" check_all="yes">C:\Users\*\AppData\Roaming</directories>
    <directories realtime="yes" report_changes="no" check_all="yes">C:\Windows\Temp</directories>
    <directories realtime="yes" report_changes="no" check_all="yes">C:\ProgramData</directories>

    <!-- 2. Mục tiêu mã hóa chính của Ransomware (Dữ liệu người dùng) -->
    <directories whodata="yes" realtime="yes" report_changes="yes" check_all="yes">C:\Users\*\Documents</directories>
    <directories whodata="yes" realtime="yes" report_changes="yes" check_all="yes">C:\Users\*\Desktop</directories>
    <directories whodata="yes" realtime="yes" report_changes="yes" check_all="yes">C:\Users\*\Downloads</directories>
    <directories whodata="yes" realtime="yes" report_changes="no" check_all="yes">C:\Users\*\Pictures</directories>
    <directories whodata="yes" realtime="yes" report_changes="no" check_all="yes">C:\Users\*\Videos</directories>


    <!-- 3. Khu vực chiếm quyền điều khiển hệ thống hoặc vô hiệu hóa Shadow Copies -->
    <directories realtime="yes" report_changes="no" check_all="yes">C:\Windows\System32\drivers\etc</directories>
    <windows_registry realtime="yes" check_all="yes">HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Run</windows_registry>
    <windows_registry realtime="yes" check_all="yes">HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\RunOnce</windows_registry>

    <!-- Persistence -->
      <!-- Folder need to be monitored -->
        <!-- .001 Startup Folders -->
        <directories realtime="yes" check_all="yes" restrict="*.lnk|*.exe|*.bat|*.vbs|*.ps1|*.com">C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Startup</directories>
        <directories realtime="yes" check_all="yes" restrict="*.lnk|*.exe|*.bat|*.vbs|*.ps1|*.com">C:\Users\*\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup</directories>

        <!-- .009 Shortcut Modification -->
        <directories realtime="yes" check_all="yes" restrict="*.lnk">C:\Users\*\Desktop</directories>
        <directories realtime="yes" check_all="yes" restrict="*.lnk">C:\Users\*\AppData\Roaming\Microsoft\Internet Explorer\Quick Launch</directories>

        <!-- .010 Port Monitors / .012 Print Processors (Thường nằm trong System32/Driver) -->
        <directories realtime="yes" check_all="yes">C:\Windows\System32\spool\drivers\x64\3</directories>
        <directories realtime="yes" check_all="yes">C:\Windows\System32\spool\prtprocs\x64</directories>

        <!-- .006 Kernel Drivers (Windows) -->
        <directories realtime="yes" check_all="yes">C:\Windows\System32\drivers</directories>
      
      <!-- Registry -->
        <!-- .001 Run Keys -->
        <registry>HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Run</registry>
        <registry>HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run</registry>
        <registry>HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\RunOnce</registry>

        <!-- .004 Winlogon -->
        <registry>HKEY_LOCAL_MACHINE\Software\Microsoft\Windows NT\CurrentVersion\Winlogon</registry>

        <!-- .005 SSP / .002 Auth Packages -->
        <registry>HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Lsa</registry>

        <!-- .003 Time Providers -->
        <registry>HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services\W32Time\TimeProviders</registry>

        <!-- .014 Active Setup -->
        <registry>HKEY_LOCAL_MACHINE\Software\Microsoft\Active Setup\Installed Components</registry>

    <!-- Persistence End -->

    <!-- ================= LINUX MONITORING ================= -->
    <!-- 1. Nơi Ransomware Linux tải file nhị phân độc hại về thực thi -->
    <directories realtime="yes" report_changes="no" check_all="yes">/tmp</directories>
    <directories realtime="yes" report_changes="no" check_all="yes">/var/tmp</directories>
    <directories realtime="yes" report_changes="no" check_all="yes">/dev/shm</directories>

    <!-- 2. Thư mục mã hóa dữ liệu dịch vụ trọng yếu -->
    <directories realtime="yes" report_changes="yes" check_all="yes">/var/www</directories>
    <directories realtime="yes" report_changes="yes" check_all="yes">/home/*</directories>

    <!-- Loại trừ các file thay đổi liên tục để tránh báo động giả (False Positives) -->
    <ignore type="sregex">.log$|.tmp$</ignore>
  </syscheck>
</agent_config>
<agent_config>
  <localfile>
    <location>OpenSSH/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <client_buffer>
    <disabled>no</disabled>
    <queue_size>50000</queue_size>
    <events_per_second>1000</events_per_second>
  </client_buffer>

  <syscheck>
    <!-- Tần suất quét sâu định kỳ (mặc định 12 tiếng) -->
    <frequency>43200</frequency>

    <!-- ================= WINDOWS MONITORING ================= -->
    

    <!-- Persistence End -->

    <!-- ================= LINUX MONITORING ================= -->
    <!-- 1. Nơi Ransomware Linux tải file nhị phân độc hại về thực thi -->
    <directories realtime="yes" report_changes="no" check_all="yes">/tmp</directories>
    <directories realtime="yes" report_changes="no" check_all="yes">/var/tmp</directories>
    <directories realtime="yes" report_changes="no" check_all="yes">/dev/shm</directories>

    <!-- 2. Thư mục mã hóa dữ liệu dịch vụ trọng yếu -->
    <directories realtime="yes" report_changes="yes" check_all="yes">/var/www</directories>
    <directories realtime="yes" report_changes="yes" check_all="yes">/home/*</directories>

    <!-- Loại trừ các file thay đổi liên tục để tránh báo động giả (False Positives) -->
    <ignore type="sregex">.log$|.tmp$</ignore>
  </syscheck>
</agent_config>